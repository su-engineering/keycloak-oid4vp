services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command:
      - start-dev
      - --verbose
      - --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      KC_LOG_LEVEL: info,io.github.suengineering:trace
    ports:
      - "8080:8080"
    volumes:
      - ./target/keycloak-extension-oid4vp.jar:/opt/keycloak/providers/keycloak-extension-oid4vp.jar:ro
      - ${OID4VP_REALM_IMPORT:-./deployment/realm-import.json}:/opt/keycloak/data/import/realm-import.json:ro
